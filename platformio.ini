r ; ESP32 Evil Twin — PlatformIO config
; Uses espressif32@6.7.0 (Arduino Core 2.0.x / ESP-IDF 4.4)
; This is REQUIRED for esp_wifi_80211_tx() to send deauth/disassoc frames.
; Arduino Core 3.x (ESP-IDF 5.x) blocks raw management frame injection.

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

; TFT_eSPI display config — passed as build flags to override User_Setup.h
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=15
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSUPPORT_TRANSACTIONS=1
    -Wl,-zmuldefs

; Allow our ieee80211_raw_frame_sanity_check override to replace libnet80211's version
build_unflags = -Wl,--no-undefined

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; ---------------------------------------------------------------------------
; Host-side unit tests for the hardware-independent artemisz_core library.
; Run with:  pio test -e native
; The Makefile (`make test`) is the authoritative/zero-dependency runner and
; is what CI uses; this env is a PlatformIO-native convenience.
[env:native]
platform = native
test_framework = custom
build_flags = -std=c++11 -Wall -Wextra
